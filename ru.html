<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyv4caJY1WuunU3dArRi18PSy5DQH1v4k5RDMQ1QA6norBba5cD_3DzLkHIV_A8CN5B/exec";

// Язык этого файла — определяет, какие столбцы Google Sheets будут использоваться
// (name_ru, description_ru, category_ru). В index.html — "en", в ka.html — "ka".
const LANG = "ru";

async function loadMenuFromGoogleSheets() {
    try {
        const response = await fetch(APPS_SCRIPT_URL);
        const data = await response.json();

        const categories = {};
        data.forEach(item => {
            if (!categories[item.category]) {
                categories[item.category] = [];
            }
            categories[item.category].push(item);
        });

        const categoryGrid = document.getElementById('category-grid-container');
        const subMenusContainer = document.getElementById('sub-menus-container');

        categoryGrid.innerHTML = '';
        subMenusContainer.innerHTML = '';

        Object.keys(categories).forEach(catName => {
            const menuId = `${catName.toLowerCase().replace(/\s+/g, '-')}-menu`;
            const firstItem = categories[catName][0];

            // Название категории на этом языке (столбец category_ru), иначе — исходное catName
            const catLabel = firstItem[`category_${LANG}`] || catName;

            categoryGrid.innerHTML += `
                <div class="category-card" onclick="toggleMenu('${menuId}')">
                    <div class="category-image">
                        <img src="${firstItem.image}" alt="${catLabel}">
                    </div>
                    <span class="category-name">${catLabel.toUpperCase()}</span>
                </div>
            `;

            let itemsHtml = '';
            categories[catName].forEach(item => {
    // Название/описание блюда на этом языке (name_ru / description_ru), иначе — базовый столбец
    const itemName = item[`name_${LANG}`] || item.name;
    const itemDesc = item[`description_${LANG}`] || item.description || '';

    const itemImgHtml = item.item_image 
        ? `<div class="item-image"><img src="${item.item_image}" alt="${itemName}"></div>` 
        : '';

    const safeName = itemName.replace(/'/g, "\\'");

    if (item.price_bottle && item.price_bottle > 0) {
        itemsHtml += `
            <div class="menu-item">
                ${itemImgHtml}
                <div class="item-info">
                    <span class="item-name">${itemName}</span>
                    <span class="item-desc">${itemDesc}</span>
                </div>
                <div class="item-price-action">
                    <span id="price-${item.id}">${item.price_glass} GEL</span>
                    <button onclick="toggleWinePrice('${item.id}', ${item.price_glass}, ${item.price_bottle})">Бутылка</button>
                    <button class="add-to-cart-btn" onclick="addToCart('${safeName}', ${item.price_glass})"> + </button>
                </div>
            </div>
        `;
    } else {
        itemsHtml += `
            <div class="menu-item">
                ${itemImgHtml}
                <div class="item-info">
                    <span class="item-name">${itemName}</span>
                    <span class="item-desc">${itemDesc}</span>
                </div>
                <div class="item-price-action">
                    <span>${item.price_glass} GEL</span>
                    <button class="add-to-cart-btn" onclick="addToCart('${safeName}', ${item.price_glass})"> + Добавить</button>
                </div>
            </div>
        `;
    }
});
            subMenusContainer.innerHTML += `
                <div id="${menuId}" class="sub-menu-container">
                    <h3>${catLabel}</h3>
                    <div class="menu-items-list">
                        ${itemsHtml}
                    </div>
                </div>
            `;
        });

    } catch (error) {
        console.error("Ошибка загрузки меню:", error);
        showToast("Не удалось загрузить меню. Обновите страницу.", "error");
    }
}

document.addEventListener("DOMContentLoaded", loadMenuFromGoogleSheets);

function toggleMenu(menuId) {
    document.querySelectorAll('.sub-menu-container').forEach(menu => {
        if(menu.id !== menuId) menu.classList.remove('active');
    });
    
    const selectedMenu = document.getElementById(menuId);
    if (selectedMenu) {
        selectedMenu.classList.toggle('active');
        if(selectedMenu.classList.contains('active')) {
            setTimeout(() => {
                selectedMenu.scrollIntoView({ behavior: 'smooth' });
            }, 200);
        }
    }
}

function toggleWinePrice(wineId, glassPrice, bottlePrice) {
    const priceSpan = document.getElementById(`price-${wineId}`);
    const btn = event.target;

    if (priceSpan.innerText.includes(glassPrice)) {
        priceSpan.innerText = `${bottlePrice} GEL`;
        btn.innerText = "Бокал";
        btn.classList.add('bottle-active');
    } else {
        priceSpan.innerText = `${glassPrice} GEL`;
        btn.innerText = "Бутылка";
        btn.classList.remove('bottle-active');
    }
}

let cart = [];

const urlParams = new URLSearchParams(window.location.search);
const tableNumber = urlParams.get('table') || 'Unknown';

function addToCart(name, price) {
    const existingItem = cart.find(item => item.name === name);
    if (existingItem) {
        existingItem.quantity += 1;
    } else {
        cart.push({ name, price, quantity: 1 });
    }
    updateCartUI();
    showToast(`${name} добавлено в корзину`, "success", 1800);
}

function updateCartUI() {
    const cartCount = cart.reduce((sum, item) => sum + item.quantity, 0);
    const cartTotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

    document.getElementById('cart-count').innerText = cartCount;
    document.getElementById('cart-total').innerText = cartTotal;
    document.getElementById('modal-cart-total').innerText = cartTotal;

    const cartItemsList = document.getElementById('cart-items-list');
    cartItemsList.innerHTML = '';

    cart.forEach((item, index) => {
        cartItemsList.innerHTML += `
            <div class="cart-item">
                <span>${item.name} x${item.quantity}</span>
                <span>${item.price * item.quantity} GEL</span>
                <button onclick="removeFromCart(${index})">❌</button>
            </div>
        `;
    });
}

function removeFromCart(index) {
    cart.splice(index, 1);
    updateCartUI();
}

function toggleCartModal() {
    const modal = document.getElementById('cart-modal');
    modal.classList.toggle('active');
}

function showToast(message, type = "success", duration = 3200) {
    const container = document.getElementById('toast-container');
    if (!container) {
        console.log(message);
        return;
    }

    const icons = {
        success: "✓",
        error: "✕",
        warning: "!"
    };

    const toast = document.createElement('div');
    toast.className = `toast toast-${type}`;
    toast.innerHTML = `
        <span class="toast-icon">${icons[type] || icons.success}</span>
        <span class="toast-message">${message}</span>
    `;

    container.appendChild(toast);

    requestAnimationFrame(() => toast.classList.add('toast-show'));

    setTimeout(() => {
        toast.classList.remove('toast-show');
        toast.classList.add('toast-hide');
        setTimeout(() => toast.remove(), 300);
    }, duration);
}

const WAITER_COOLDOWN_SECONDS = 60;
const ORDER_COOLDOWN_SECONDS = 20;

function startButtonCooldown(button, seconds, originalLabel) {
    let remaining = seconds;
    button.disabled = true;
    button.classList.add('cooldown-active');
    button.innerText = `⏳ ${remaining}с`;

    const interval = setInterval(() => {
        remaining -= 1;
        if (remaining <= 0) {
            clearInterval(interval);
            button.disabled = false;
            button.classList.remove('cooldown-active');
            button.innerText = originalLabel;
        } else {
            button.innerText = `⏳ ${remaining}с`;
        }
    }, 1000);
}

const TELEGRAM_BOT_TOKEN = "8936124869:AAHOUat_DBejKWz8_iPCfJ5HnZrae-pidx0";
const TELEGRAM_CHAT_ID = "6724312303";

const RESTAURANT_WIFI_IPS = [
    "212.58.114.202"
];

async function getUserIP() {
    try {
        const response = await fetch("https://api.ipify.org?format=json");
        const data = await response.json();
        return data.ip;
    } catch (error) {
        console.error("Не удалось определить IP:", error);
        return null;
    }
}

async function isUserOnRestaurantWifi() {
    const userIP = await getUserIP();
    console.log("User IP:", userIP);
    
    if (!userIP) return false;
    return RESTAURANT_WIFI_IPS.includes(userIP);
}

async function callWaiter() {
    const btn = document.querySelector('.call-waiter-btn');
    if (btn && btn.disabled) return;

    const isOnWifi = await isUserOnRestaurantWifi();

    if (!isOnWifi) {
        showToast("Вызов официанта возможен только при подключении к Wi-Fi ресторана", "warning");
        return;
    }

    const message = `🔔 *Вызов официанта!*\n📍 *Столик:* №${tableNumber}`;

    try {
        const res = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                chat_id: TELEGRAM_CHAT_ID,
                text: message,
                parse_mode: 'Markdown'
            })
        });

        if (res.ok) {
            showToast(`Официант вызван к столику №${tableNumber}`, "success");
            if (btn) startButtonCooldown(btn, WAITER_COOLDOWN_SECONDS, "🔔 Позвать официанта");
        } else {
            showToast("Ошибка при вызове. Попробуйте снова.", "error");
        }
    } catch (e) {
        showToast("Ошибка соединения! Проверьте интернет.", "error");
    }
}

async function sendOrder() {
    const btn = document.querySelector('.send-order-btn');
    if (btn && btn.disabled) return;

    if (cart.length === 0) {
        showToast("Корзина пуста!", "warning");
        return;
    }

    const isOnWifi = await isUserOnRestaurantWifi();

    if (!isOnWifi) {
        showToast("Отправка заказа возможна только при подключении к Wi-Fi ресторана", "warning");
        return;
    }

    let itemsText = cart.map(i => `• ${i.name} x${i.quantity} — ${i.price * i.quantity} GEL`).join('\n');
    let total = cart.reduce((sum, i) => sum + (i.price * i.quantity), 0);
    
    const message = `🍽️ *Новый заказ!*\n📍 *Столик:* №${tableNumber}\n\n*Блюда:*\n${itemsText}\n\n💰 *Итого:* ${total} GEL`;

    try {
        const res = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                chat_id: TELEGRAM_CHAT_ID,
                text: message,
                parse_mode: 'Markdown'
            })
        });

        if (res.ok) {
            showToast("Заказ успешно отправлен на кухню!", "success");
            if (btn) startButtonCooldown(btn, ORDER_COOLDOWN_SECONDS, "Отправить заказ на кухню");
            cart = [];
            updateCartUI();
            toggleCartModal();
        } else {
            showToast("Не удалось отправить заказ.", "error");
        }
    } catch (e) {
        showToast("Ошибка соединения! Проверьте интернет.", "error");
    }
}

function toggleMobileMenu() {
    document.getElementById('mobile-menu-drawer').classList.toggle('active');
    document.getElementById('mobile-menu-overlay').classList.toggle('active');
    document.body.style.overflow = document.getElementById('mobile-menu-drawer').classList.contains('active') ? 'hidden' : '';
}

</script>
