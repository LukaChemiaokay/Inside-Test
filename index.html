<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyv4caJY1WuunU3dArRi18PSy5DQH1v4k5RDMQ1QA6norBba5cD_3DzLkHIV_A8CN5B/exec";

// ამ ფაილის ენა — განსაზღვრავს, Google Sheets-ის რომელ სვეტებს წაიკითხავს
// (name_en, description_en, category_en). ka.html-ში "ka", ru.html-ში "ru".
const LANG = "en";

async function loadMenuFromGoogleSheets() {
    try {
        const response = await fetch(APPS_SCRIPT_URL);
        const data = await response.json();

        // 1. მონაცემების დაჯგუფება კატეგორიების მიხედვით
        const categories = {};
        data.forEach(item => {
            if (!categories[item.category]) {
                categories[item.category] = [];
            }
            categories[item.category].push(item);
        });

        const categoryGrid = document.getElementById('category-grid-container');
        const subMenusContainer = document.getElementById('sub-menus-container');

        categoryGrid.innerHTML = '';
        subMenusContainer.innerHTML = '';

        // 2. კატეგორიებისა და კერძების დინამიური აგება
        Object.keys(categories).forEach(catName => {
            const menuId = `${catName.toLowerCase().replace(/\s+/g, '-')}-menu`;
            const firstItem = categories[catName][0];

            // კატეგორიის სახელი ამ ენაზე (category_en სვეტიდან), თუ ცარიელია — უცვლელი catName
            const catLabel = firstItem[`category_${LANG}`] || catName;

            // კატეგორიის მთავარი ბარათი
            categoryGrid.innerHTML += `
                <div class="category-card" onclick="toggleMenu('${menuId}')">
                    <div class="category-image">
                        <img src="${firstItem.image}" alt="${catLabel}">
                    </div>
                    <span class="category-name">${catLabel.toUpperCase()}</span>
                </div>
            `;

            // ქვემენიუს შიგთავსი კერძების ფოტოებით
            let itemsHtml = '';
            categories[catName].forEach(item => {
    // კერძის სახელი/აღწერა ამ ენაზე (name_en / description_en), თუ ცარიელია — საბაზისო სვეტი
    const itemName = item[`name_${LANG}`] || item.name;
    const itemDesc = item[`description_${LANG}`] || item.description || '';

    // კერძის ფოტოს HTML (თუ Google Sheets-ში შევსებულია item_image)
    const itemImgHtml = item.item_image 
        ? `<div class="item-image"><img src="${item.item_image}" alt="${itemName}"></div>` 
        : '';

    // კერძის/სასმელის სახელიდან და ფასიდან ბრჭყალების შეცდომების თავიდან ასაცილებლად
    const safeName = itemName.replace(/'/g, "\\'");

    if (item.price_bottle && item.price_bottle > 0) {
        // ღვინის ან ბოთლით/ჭიქით გაყიდვადი სასმელის ბლოკი
        itemsHtml += `
            <div class="menu-item">
                ${itemImgHtml}
                <div class="item-info">
                    <span class="item-name">${itemName}</span>
                    <span class="item-desc">${itemDesc}</span>
                </div>
                <div class="item-price-action">
                    <span id="price-${item.id}">${item.price_glass} GEL</span>
                    <button onclick="toggleWinePrice('${item.id}', ${item.price_glass}, ${item.price_bottle})">Bottle</button>
                    <button class="add-to-cart-btn" onclick="addToCart('${safeName}', ${item.price_glass})"> + </button>
                </div>
            </div>
        `;
    } else {
        // სტანდარტული კერძის ბლოკი
        itemsHtml += `
            <div class="menu-item">
                ${itemImgHtml}
                <div class="item-info">
                    <span class="item-name">${itemName}</span>
                    <span class="item-desc">${itemDesc}</span>
                </div>
                <div class="item-price-action">
                    <span>${item.price_glass} GEL</span>
                    <button class="add-to-cart-btn" onclick="addToCart('${safeName}', ${item.price_glass})"> + Add</button>
                </div>
            </div>
        `;
    }
});
            subMenusContainer.innerHTML += `
                <div id="${menuId}" class="sub-menu-container">
                    <h3>${catLabel}</h3>
                    <div class="menu-items-list">
                        ${itemsHtml}
                    </div>
                </div>
            `;
        });

    } catch (error) {
        console.error("შეცდომა მენიუს ჩატვირთვისას:", error);
        showToast("Failed to load the menu. Please refresh the page.", "error");
    }
}

document.addEventListener("DOMContentLoaded", loadMenuFromGoogleSheets);

// შენი არსებული ინტერაქციის ფუნქციები (უცვლელი)
function toggleMenu(menuId) {
    document.querySelectorAll('.sub-menu-container').forEach(menu => {
        if(menu.id !== menuId) menu.classList.remove('active');
    });
    
    const selectedMenu = document.getElementById(menuId);
    if (selectedMenu) {
        selectedMenu.classList.toggle('active');
        if(selectedMenu.classList.contains('active')) {
            setTimeout(() => {
                selectedMenu.scrollIntoView({ behavior: 'smooth' });
            }, 200);
        }
    }
}

function toggleWinePrice(wineId, glassPrice, bottlePrice) {
    const priceSpan = document.getElementById(`price-${wineId}`);
    const btn = event.target;

    if (priceSpan.innerText.includes(glassPrice)) {
        priceSpan.innerText = `${bottlePrice} GEL`;
        btn.innerText = "Glass";
        btn.classList.add('bottle-active');
    } else {
        priceSpan.innerText = `${glassPrice} GEL`;
        btn.innerText = "Bottle";
        btn.classList.remove('bottle-active');
    }
}

let cart = [];

// 1. მაგიდის ნომრის ამოღება URL-იდან (მაგ: site.com/?table=3)
const urlParams = new URLSearchParams(window.location.search);
const tableNumber = urlParams.get('table') || 'Unknown';

// 2. კერძის კალათაში დამატება
function addToCart(name, price) {
    const existingItem = cart.find(item => item.name === name);
    if (existingItem) {
        existingItem.quantity += 1;
    } else {
        cart.push({ name, price, quantity: 1 });
    }
    updateCartUI();
    showToast(`${name} added to cart`, "success", 1800);
}

// 3. კალათის ვიზუალის განახლება
function updateCartUI() {
    const cartCount = cart.reduce((sum, item) => sum + item.quantity, 0);
    const cartTotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

    document.getElementById('cart-count').innerText = cartCount;
    document.getElementById('cart-total').innerText = cartTotal;
    document.getElementById('modal-cart-total').innerText = cartTotal;

    const cartItemsList = document.getElementById('cart-items-list');
    cartItemsList.innerHTML = '';

    cart.forEach((item, index) => {
        cartItemsList.innerHTML += `
            <div class="cart-item">
                <span>${item.name} x${item.quantity}</span>
                <span>${item.price * item.quantity} GEL</span>
                <button onclick="removeFromCart(${index})">❌</button>
            </div>
        `;
    });
}

function removeFromCart(index) {
    cart.splice(index, 1);
    updateCartUI();
}

function toggleCartModal() {
    const modal = document.getElementById('cart-modal');
    modal.classList.toggle('active');
}

// ==========================================================================
// TOAST NOTIFICATIONS — alert()-ის ლამაზი ჩანაცვლება
// ==========================================================================
function showToast(message, type = "success", duration = 3200) {
    const container = document.getElementById('toast-container');
    if (!container) {
        // fallback, თუ კონტეინერი რატომღაც არ არსებობს
        console.log(message);
        return;
    }

    const icons = {
        success: "✓",
        error: "✕",
        warning: "!"
    };

    const toast = document.createElement('div');
    toast.className = `toast toast-${type}`;
    toast.innerHTML = `
        <span class="toast-icon">${icons[type] || icons.success}</span>
        <span class="toast-message">${message}</span>
    `;

    container.appendChild(toast);

    // ანიმაციით გამოჩენა
    requestAnimationFrame(() => toast.classList.add('toast-show'));

    // ავტომატური გაქრობა
    setTimeout(() => {
        toast.classList.remove('toast-show');
        toast.classList.add('toast-hide');
        setTimeout(() => toast.remove(), 300);
    }, duration);
}

// ==========================================================================
// ღილაკების ქულდაუნი (Cooldown) — სპამის თავიდან ასაცილებლად
// ==========================================================================
const WAITER_COOLDOWN_SECONDS = 60;   // ოფიციანტის გამოძახების ინტერვალი
const ORDER_COOLDOWN_SECONDS = 20;    // შეკვეთის გაგზავნის ინტერვალი

function startButtonCooldown(button, seconds, originalLabel) {
    let remaining = seconds;
    button.disabled = true;
    button.classList.add('cooldown-active');
    button.innerText = `⏳ ${remaining}s`;

    const interval = setInterval(() => {
        remaining -= 1;
        if (remaining <= 0) {
            clearInterval(interval);
            button.disabled = false;
            button.classList.remove('cooldown-active');
            button.innerText = originalLabel;
        } else {
            button.innerText = `⏳ ${remaining}s`;
        }
    }, 1000);
}

// 1. პარამეტრების კონფიგურაცია
const TELEGRAM_BOT_TOKEN = "8936124869:AAHOUat_DBejKWz8_iPCfJ5HnZrae-pidx0";
const TELEGRAM_CHAT_ID = "6724312303";

// რესტორნის Wi-Fi-ს საჯარო IP მისამართი (ან რამდენიმე IP, თუ რამდენიმე პროვაიდერია)
const RESTAURANT_WIFI_IPS = [
    "212.58.114.202" // ჩაწერე შენი რესტორნის რეალური IP მისამართი
];

// მომხმარებლის მიმდინარე IP-ს გასაგებად
async function getUserIP() {
    try {
        const response = await fetch("https://api.ipify.org?format=json");
        const data = await response.json();
        return data.ip;
    } catch (error) {
        console.error("IP-ს დადგენა ვერ მოხერხდა:", error);
        return null;
    }
}

// შემოწმება: არის თუ არა მომხმარებელი რესტორნის Wi-Fi-ზე?
async function isUserOnRestaurantWifi() {
    const userIP = await getUserIP();
    console.log("User IP:", userIP);
    
    if (!userIP) return false;
    return RESTAURANT_WIFI_IPS.includes(userIP);
}

// 2. ოფიციანტის გამოძახება (IP შემოწმებით + ქულდაუნით + toast-შეტყობინებით)
async function callWaiter() {
    const btn = document.querySelector('.call-waiter-btn');
    if (btn && btn.disabled) return;

    const isOnWifi = await isUserOnRestaurantWifi();

    if (!isOnWifi) {
        showToast("Calling the waiter is only available on the restaurant Wi-Fi network", "warning");
        return;
    }

    const message = `🔔 *ოფიციანტის გამოძახება!*\n📍 *მაგიდა:* №${tableNumber}`;

    try {
        const res = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                chat_id: TELEGRAM_CHAT_ID,
                text: message,
                parse_mode: 'Markdown'
            })
        });

        if (res.ok) {
            showToast(`Waiter has been called to table No. ${tableNumber}`, "success");
            if (btn) startButtonCooldown(btn, WAITER_COOLDOWN_SECONDS, "🔔 Call Waiter");
        } else {
            showToast("Something went wrong. Please try again.", "error");
        }
    } catch (e) {
        showToast("Connection error! Please check your internet.", "error");
    }
}

// 3. შეკვეთის გაგზავნა (IP შემოწმებით + ქულდაუნით + toast-შეტყობინებით)
async function sendOrder() {
    const btn = document.querySelector('.send-order-btn');
    if (btn && btn.disabled) return;

    if (cart.length === 0) {
        showToast("Your cart is empty!", "warning");
        return;
    }

    const isOnWifi = await isUserOnRestaurantWifi();

    if (!isOnWifi) {
        showToast("Sending an order is only available on the restaurant Wi-Fi network", "warning");
        return;
    }

    let itemsText = cart.map(i => `• ${i.name} x${i.quantity} — ${i.price * i.quantity} GEL`).join('\n');
    let total = cart.reduce((sum, i) => sum + (i.price * i.quantity), 0);
    
    const message = `🍽️ *ახალი შეკვეთა!*\n📍 *მაგიდა:* №${tableNumber}\n\n*კერძები:*\n${itemsText}\n\n💰 *სულ:* ${total} GEL`;

    try {
        const res = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                chat_id: TELEGRAM_CHAT_ID,
                text: message,
                parse_mode: 'Markdown'
            })
        });

        if (res.ok) {
            showToast("Your order has been sent to the kitchen!", "success");
            if (btn) startButtonCooldown(btn, ORDER_COOLDOWN_SECONDS, "Send Order to Kitchen");
            cart = [];
            updateCartUI();
            toggleCartModal();
        } else {
            showToast("Failed to send the order.", "error");
        }
    } catch (e) {
        showToast("Connection error! Please check your internet.", "error");
    }
}
